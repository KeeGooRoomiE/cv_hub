  - type: text
    title: "Обзор"
    body: |
      Timberman Multiplayer — реалтайм-дуэль на двоих по мотивам Timberman: два лесоруба рубят одно дерево друг напротив друга по живому соединению, пока не прилетит ветка. Сделано в одиночку на GameMaker Studio за две недели, мультиплеер — на собственном бэкенде Node.js + Socket.io. Проект в открытом доступе на GitHub.

  - type: divider

  - type: text
    title: "Роль"
    body: |
      Я был единственным разработчиком: геймплей, интерфейс, сборка на GameMaker и сетевой сервер — всё шло через меня, в рамках двухнедельного срока.

  - type: divider

  - type: text
    title: "Геймплей и режимы"
    body: |
      Матч открывается отсчётом 3-2-1-GO, после чего оба игрока рубят дерево в реальном времени 3 минуты. Ветка выдерживает два удара по лесорубу — третий убивает. На этой же основе сделаны два режима: Survival, где выигрывает тот, у кого больше очков к концу таймера, и Speed — гонка до 500 очков, где достижение порога запускает анимацию гнезда с птенцами и сразу завершает матч. Четыре скина лесоруба и три стиля окружения добавляют визуальное разнообразие без изменения самой механики.

  - type: divider

  - type: text
    title: "Мультиплеер и сеть"
    body: |
      Мультиплеерный слой — отдельный сервер на Node.js с Socket.io, независимый от клиента на GameMaker. Дисконнект обрабатывается явно, а не просто завершает матч: очки отключившегося игрока фиксируются, а соперник продолжает играть против этой зафиксированной отметки. Прямую победу соперник получает только если он жив и опережает по очкам — иначе решает сравнение итоговых очков, зафиксированных против живых. Если игрок успевает переподключиться, матч продолжается как обычно.

  - type: divider

  - type: text
    title: "Результат"
    body: |
      Игра вышла, а позже вошла в систему MINDPLAYS — игровой портал, который не ведёт метрики по отдельным играм, поэтому отдельных цифр по этому проекту нет, кроме открытого кода на GitHub.
