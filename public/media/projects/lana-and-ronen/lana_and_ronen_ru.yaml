  - type: text
    title: "Обзор"
    body: |
      Lana & Ronen — мобильный match-3 про фрукты и динозавра для детской аудитории. Языки: иврит, русский, английский. Основной рынок — Израиль.

      Проект был заказом от Lana Meinart, блогерши на YouTube, которой нужна была игра под собственный канал. Я был единственным разработчиком — от геймдизайна до публикации — в команде со мной работал один художник.

  - type: divider

  - type: text
    title: "Роль"
    body: |
      Как единственный разработчик, я отвечал за весь пайплайн: геймдизайн уровней, код на Unity, баланс, интеграцию рекламы и магазина, локализацию, сборки и публикацию в сторах — а также за прямую переписку с заказчицей. Художник в команде закрывал визуальные ассеты, всё остальное шло через меня.

  - type: divider

  - type: text
    title: "Старт с проверенной базы"
    body: |
      Вместо старта с нуля Lana & Ronen переиспользовала ядро match-3 и логику экранов из Helens Quiz — моего более раннего проекта: рабочую основу вместо пустого Unity-проекта. Всё игро-специфичное строилось поверх неё заново: контент уровней, препятствия, бустеры и системы метагейма (колесо фортуны, магазин, яйцо динозавра).

  - type: divider

  - type: text
    title: "Контент"
    anchor: "content"
    body: |
      Игра вышла со 150 уровнями в 5 биомах с плавным переходом между ними, а позже их число выросло до 200+. Препятствия вводились по одному, а не все сразу: закрытые фрукты — с 11-го уровня, конфеты — с 50-го, вафли и крекеры — с 57-го, жёлудь как ингредиент, который нужно спустить вниз, — с 30-го, плюс отдельные водные уровни.

      Бустеры — торнадо и фейерверки. Метагейм вокруг основного цикла: колесо фортуны, магазин и яйцо динозавра, которое нужно было вырастить через игру.

  - type: image
    src: /media/projects/lana-and-ronen/map-overview.jpg
    alt: "Карта уровней — один из 5 биомов, с путём между уровнями"
    caption: "У каждого биома своё окружение и свой путь по уровням, прежде чем плавно передать эстафету следующему."

  - type: image
    src: /media/projects/lana-and-ronen/biome-ocean.jpg
    alt: "Поле match-3 в подводном биоме, активен бустер-фейерверк"
    caption: "Подводный биом — один из 5, у каждого своё оформление поля и набор препятствий."

  - type: divider

  - type: text
    title: "Баланс"
    body: |
      Сложность отслеживалась автоматически через собственный инструментарий в Unity — считались динамическая сложность, процент фейлов и время прохождения по каждому уровню. Сама настройка баланса была ручной: после каждой правки уровень проходился около 10 раз, чтобы исключить влияние рандома и не настраивать баланс по шуму. Уровни 46–100 позже переставили местами, чтобы выровнять неровную кривую сложности.

  - type: divider

  - type: text
    title: "Обучение"
    body: |
      Базовые правила и неочевидные механики объясняются через диалоги, остальное игрок осваивает сам. Уровень 50 — это намеренный полигон без подсказок, чистая проверка навыка прежде чем игра окончательно доверяет игроку. Следующий за ним уровень отдельно противопоставляет вафли и крекеры — эти два препятствия достаточно похожи, чтобы запутать нового игрока.

  - type: divider

  - type: text
    title: "Монетизация"
    body: |
      Рекламный запрос предлагается каждые 3 победы в обмен на дополнительные ходы или спин колеса фортуны. Показывать ли предложение вообще — зависит от наличия заполненной рекламы: если объявления нет, кнопка просто становится неактивной вместо показа нерабочего предложения.

  - type: divider

  - type: text
    title: "Локализация"
    body: |
      Иврит читается справа налево, поэтому ивритский текст вставлялся вручную, а не полагался на автоматическое зеркалирование. У слова «очки» в иврите есть две разные грамматические формы — это пришлось обрабатывать явно, а не как единый неизменный лейбл.

      Часть контента адаптировали под рынок, а не просто перевели: сахар-рафинад заменили на что-то узнаваемое локально (в Израиле он не распространён), сироп переименовали в мёд, а чёрные ракеты-бонусы заменили падающими звёздами.

  - type: image
    src: /media/projects/lana-and-ronen/biome-volcano.jpg
    alt: "Поле match-3 в вулканическом биоме, интерфейс на иврите читается справа налево"
    caption: "Текст в HUD сверху читается справа налево — ивритские строки вставлялись вручную, а не зеркалировались автоматически."

  - type: divider

  - type: text
    title: "Работа с заказчиком"
    body: |
      Три раунда правок пришлись на май–июнь 2019 года — всего 74 треда комментариев, и каждый закрыт либо правкой, либо задокументированным обоснованием отказа. Готовый проект передали Lana Meinart для её канала.

  - type: divider

  - type: text
    title: "Результат"
    body: |
      Игра набрала 1M+ скачиваний на Google Play за первые полгода после публикации.
