    src: /media/projects/lana-and-ronen/map-overview.jpg
    alt: "Level map — one of the 5 biomes, with the path winding between levels"
    caption: "Each biome gets its own setting and level path before smoothly handing off to the next."

  - type: image
    src: /media/projects/lana-and-ronen/biome-ocean.jpg
    alt: "Match-3 board in the underwater biome, with a firework booster active"
    caption: "The underwater biome — one of 5, each with its own board dressing and obstacle mix."

  - type: divider

  - type: text
    title: "Balance"
    body: |
      Difficulty was tracked automatically through custom tooling built in Unity, logging dynamic difficulty, fail rate and completion time per level. Tuning itself was manual: after every change to a level, I played it through roughly ten times to cancel out the noise from random board states before trusting the numbers. Levels 46 through 100 were later reordered to smooth out an uneven difficulty curve.

  - type: divider

  - type: text
    title: "Onboarding"
    body: |
      Basic rules and any non-obvious mechanic are introduced through dialogue; everything else, players are left to figure out on their own. Level 50 is a deliberate no-hints checkpoint — a pure skill test before the game trusts the player fully. The level right after it specifically contrasts waffles and crackers, since the two obstacles look similar enough to confuse a new player.

  - type: divider

  - type: text
    title: "Monetization"
    body: |
      A rewarded ad is offered every 3 wins, in exchange for extra moves or an extra spin of the fortune wheel. Whether the prompt appears at all depends on ad fill — if no ad is available, the button simply goes inactive instead of showing a broken offer.

  - type: divider

  - type: text
    title: "Localization"
    body: |
      Hebrew reads right-to-left, so Hebrew strings were placed by hand rather than relying on automatic mirroring. The word for "points" also has two different grammatical forms in Hebrew, which had to be handled explicitly rather than treated as a single fixed label.

      Some content was adapted per market rather than just translated: refined sugar was swapped out for something recognizable locally (it isn't a familiar item in Israel), syrup was renamed to honey, and the black-rocket boosters were replaced with falling stars.

  - type: image
    src: /media/projects/lana-and-ronen/biome-volcano.jpg
    alt: "Match-3 board in the volcano biome, with the Hebrew UI reading right-to-left"
    caption: "The HUD text at the top reads right-to-left — Hebrew strings were hand-placed, not auto-mirrored."

  - type: divider

  - type: text
    title: "Working with the client"
    body: |
      Three rounds of revisions landed over May–June 2019, totaling 74 comment threads — every one of them closed, either with a fix or a documented reason it wasn't actioned. The finished project was handed over to Lana Meinart for her channel.

  - type: divider

  - type: text
    title: "Outcome"
    body: |
      The game passed 1M+ downloads on Google Play within six months of release.
