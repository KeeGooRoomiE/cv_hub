  - type: text
    title: "Overview"
    body: |
      Lana & Ronen is a mobile match-3 game built around a fruit character and a dinosaur, aimed at a children's audience. It shipped in Hebrew, Russian and English, with Israel as the primary market.

      It was a commission from Lana Meinart, a YouTube blogger, who wanted a branded game for her channel. I was the sole developer — everything from level design to publishing — with one artist on the team.

  - type: divider

  - type: text
    title: "Role"
    body: |
      As the only developer, I owned the full pipeline: level game design, Unity implementation, balancing, ad and store integration, localization, builds, and store publishing — plus the direct line of communication with the client. The one artist on the project covered the visual assets; everything else ran through me.

  - type: divider

  - type: text
    title: "Built on a proven base"
    body: |
      Rather than starting from zero, Lana & Ronen reused the match-3 core and the screen/UI logic from Helens Quiz, an earlier project of mine — a working foundation instead of a blank Unity project. Everything game-specific was built fresh on top of it: level content, obstacles, boosters, and the metagame systems (the fortune wheel, the shop, the dinosaur egg).

  - type: divider

  - type: text
    title: "Content"
    anchor: "content"
    body: |
      The game launched with 150 levels across 5 biomes, each transitioning smoothly into the next, and has since grown past 200. Obstacles were introduced one at a time rather than all at once: wrapped fruit from level 11, candy from level 50, waffles and crackers from level 57, and an acorn mechanic — an ingredient that has to be dropped to the bottom of the board — from level 30, alongside dedicated water levels.

      Boosters were a tornado and fireworks. The metagame layer sat around the core loop: a fortune wheel, an in-game shop, and a dinosaur egg to hatch through play.

